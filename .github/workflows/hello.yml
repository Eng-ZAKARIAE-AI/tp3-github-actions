name: Premier workflow CI

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execution du script
        run: ./script.sh

      - name: Informations Git
        run: |
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Événement : $GITHUB_EVENT_NAME"

      # Pour tester l'étape 7 (échec volontaire), décommentez la ligne ci-dessous :
      - name: Test d'échec volontaire
        run: exit 1